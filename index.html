<!doctype html>
<html lang="en" data-theme="business">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Debet card</title>
        <link
            href="https://cdn.jsdelivr.net/npm/daisyui@5"
            rel="stylesheet"
            type="text/css"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
            rel="stylesheet"
            type="text/css"
        />
        <script
            src="https://kit.fontawesome.com/6cc4f903af.js"
            crossorigin="anonymous"
        ></script>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body
        class="flex flex-col justify-center gap-[50px] items-center min-h-screen py-[50px]"
    >
        <main class="flex justify-between items-center w-[800px]">
            <!-- 
                В форму обернут <fieldset>, который стайлится через компоненты DaisyUI.
                Таким образом мы получаем красивую форму для заполнения,
                при этом оставляя весь функционал формы для JS.
            -->
            <form>
                <fieldset
                    class="w-full fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4"
                >
                    <legend class="fieldset-legend">Данные карты</legend>

                    <label class="select">
                        <span class="label">Банк</span>
                        <select id="bank-name-select">
                            <option value="undefined" selected disabled hidden>
                                Выберите банк
                            </option>
                            <option value="OZON">Ozon Банк</option>
                            <option value="SBER">Сбербанк</option>
                            <option value="ALFA">Альфа-Банк</option>
                            <option value="TBANK">Т-Банк</option>
                            <option value="POCHTABANK">Почта Банк</option>
                        </select>
                    </label>

                    <label class="input">
                        <span class="label">Номер карты</span>
                        <input
                            type="text"
                            placeholder="0000 0000 0000 0000"
                            id="card-number-input"
                            required
                        />
                    </label>

                    <label class="input">
                        <span class="label">Держатель</span>
                        <input
                            type="text"
                            placeholder="Иван Иванов"
                            id="card-holder-input"
                            required
                        />
                    </label>

                    <label class="input">
                        <span class="label">Срок действия</span>
                        <input
                            type="text"
                            placeholder="00/00"
                            id="expires-date-input"
                            required
                        />
                    </label>

                    <div
                        class="grid grid-cols-2 gap-y-[5px]"
                        id="payment-systems-radio-wrapper"
                    >
                        <label class="label w-fit">
                            <input
                                type="radio"
                                name="payment-system-radio"
                                class="radio"
                                id="jcb"
                                required
                            />
                            JCB
                        </label>

                        <label class="label w-fit">
                            <input
                                type="radio"
                                name="payment-system-radio"
                                class="radio"
                                id="visa"
                                required
                            />
                            Visa
                        </label>

                        <label class="label w-fit">
                            <input
                                type="radio"
                                name="payment-system-radio"
                                class="radio"
                                id="paypal"
                                required
                            />
                            PayPal
                        </label>

                        <label class="label w-fit">
                            <input
                                type="radio"
                                name="payment-system-radio"
                                class="radio"
                                id="stripe"
                                required
                            />
                            Stripe
                        </label>

                        <label class="label w-fit">
                            <input
                                type="radio"
                                name="payment-system-radio"
                                class="radio"
                                id="master"
                            />
                            Mastercard
                        </label>

                        <label class="label w-fit">
                            <input
                                type="radio"
                                name="payment-system-radio"
                                class="radio"
                                id="amrcnexpress"
                            />
                            American Express
                        </label>
                    </div>

                    <button class="btn btn-neutral mt-4">
                        Отправить форму
                    </button>
                </fieldset>
            </form>

            <!-- 
                Мокап карты из DaisyUI.
            -->
            <div class="hover-3d h-fit" id="card-mockup">
                <div
                    class="card w-96 bg-black text-white bg-[radial-gradient(circle_at_bottom_left,#ffffff04_35%,transparent_36%),radial-gradient(circle_at_top_right,#ffffff04_35%,transparent_36%)] bg-size-[4.95em_4.95em]"
                >
                    <div class="card-body">
                        <div class="flex justify-between mb-10">
                            <div class="font-bold" id="bank-name">
                                BANK OF LATVERIA
                            </div>
                            <div
                                class="text-5xl opacity-10"
                                id="payment-system"
                            >
                                ❁
                            </div>
                        </div>
                        <div class="text-lg mb-4 opacity-40" id="card-number">
                            0210 8820 1150 0222
                        </div>
                        <div class="flex justify-between">
                            <div>
                                <div class="text-xs opacity-20">
                                    CARD HOLDER
                                </div>
                                <div id="card-holder">VICTOR VON D.</div>
                            </div>
                            <div>
                                <div class="text-xs opacity-20">EXPIRES</div>
                                <div id="expires-date">29/08</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!--
                    8 пустых div'ов для 3D эффекта лол.
                -->
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </main>

        <table class="table w-[800px]">
            <thead>
                <tr>
                    <th></th>
                    <th>Банк</th>
                    <th>Номер карты</th>
                    <th>Держатель</th>
                    <th>Срок действия</th>
                    <th>Платежка</th>
                </tr>
            </thead>
            <tbody>
                <tr class="hover:bg-base-300">
                    <th>1</th>
                    <td>Здесь</td>
                    <td>Будут</td>
                    <td>Данные</td>
                    <td>Карты</td>
                    <td>Лол</td>
                </tr>
            </tbody>
        </table>

        <script type="module" src="main.js"></script>
    </body>
</html>
